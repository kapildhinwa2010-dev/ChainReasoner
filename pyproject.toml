[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ChainReasoner"
version = "1.0.0"
description = "Chain-of-thought reasoning module"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Kapil Dhinwa"}]

[project.urls]
Homepage = "https://github.com/kapildhinwa2010-dev/ChainReasoner"

[tool.setuptools]
packages = ["chainreasoner"]
